<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Poll results</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0e1126">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23171b36' stroke='%234fe0c0' stroke-width='2'/%3E%3Cpath d='M12 9l12 7-12 7z' fill='%234fe0c0'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="wrap">
    <header class="head">
      <p class="eyebrow">Results</p>
      <h1 id="title">Loading…</h1>
      <p id="description" class="lead"></p>
    </header>

    <div id="banner" class="banner" hidden></div>

    <section class="totals" aria-live="polite">
      <div class="big"><span id="total">0</span><small id="total-label">votes</small></div>
      <div class="muted" id="updated">Loading…</div>
    </section>

    <section aria-labelledby="results-title">
      <div class="results-head">
        <h2 id="results-title">Votes per sound</h2>
        <button id="sort" class="ghost" type="button">Sort by votes</button>
      </div>
      <ul id="results-list" class="results-list"></ul>
    </section>

    <div class="actions">
      <button id="refresh" class="ghost" type="button">Refresh now</button>
      <button id="copy" class="ghost" type="button">Copy a summary</button>
      <button id="csv" class="ghost" type="button">Download as CSV</button>
      <a class="ghost as-button" href="index.html">Back to the poll</a>
    </div>
    <p id="status" class="status" role="status" aria-live="polite"></p>

    <footer class="foot">This page refreshes by itself. The Google Sheet behind the poll lists every single vote.</footer>
  </main>

  <noscript><p class="noscript">This page needs JavaScript.</p></noscript>
  <script src="config.js"></script>
  <script src="js/poll.js"></script>
  <script src="js/results-page.js"></script>
</body>
</html>
